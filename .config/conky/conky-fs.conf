-- vim: ts=4 sw=4 noet ai cindent syntax=lua
-- Second column: filesystems and failed units.
-- Inherits all settings from conky.conf and only moves the window to the right.

local _dirname_ = debug.getinfo(1, "S").source:sub(2):match("(.*[/\\])") or "./"
dofile(_dirname_ .. "conky.conf")

-- first column: gap_x (20) + width (350) + 2 * inner (10) + 2 * outer (10) margins = 410
conky.config.gap_x = 430

-- Disks are referenced via /dev/disk/by-id because nvmeXn1 numbering is not stable across boots
-- (currently / is on nvme2n1, /mnt/old-suse on nvme1n1).
conky.text = [[
#------------+
#FILESYSTEMS
#------------+
${font}${color1}FS ${hr 2}
${voffset 5}${color1}/ (Samsung 970 EVO):${alignr}${color}${fs_used /} / ${fs_size /}
${color4}${fs_bar /}
${color1}Read: ${alignr}${color}${diskio_read /dev/disk/by-id/nvme-Samsung_SSD_970_EVO_Plus_1TB_S4EWNF0MA05511Y}
${color1}${diskiograph_read /dev/disk/by-id/nvme-Samsung_SSD_970_EVO_Plus_1TB_S4EWNF0MA05511Y}
${color1}Write: ${alignr}${color}${diskio_write /dev/disk/by-id/nvme-Samsung_SSD_970_EVO_Plus_1TB_S4EWNF0MA05511Y}
${color1}${diskiograph_write /dev/disk/by-id/nvme-Samsung_SSD_970_EVO_Plus_1TB_S4EWNF0MA05511Y}

${color1}/boot/efi:${alignr}${color}${fs_used /boot/efi} / ${fs_size /boot/efi}
${color4}${fs_bar /boot/efi}
${if_mounted /mnt/old-suse}
${color1}/mnt/old-suse (T705):${alignr}${color}${fs_used /mnt/old-suse} / ${fs_size /mnt/old-suse}
${color4}${fs_bar /mnt/old-suse}
${color1}Read: ${color}${diskio_read /dev/disk/by-id/nvme-CT2000T705SSD3_2516E9B71120}${alignr}${color1}Write: ${color}${diskio_write /dev/disk/by-id/nvme-CT2000T705SSD3_2516E9B71120}
${endif}

#------------+
#FAILED UNITS
#------------+
${color1}Failed Units ${hr 2}
${color5}${execi 5 systemctl --failed --no-legend --plain | cut -d' ' -f1}
${color5}${execi 5 systemctl --failed --user --no-legend --plain | cut -d' ' -f1}
]]
