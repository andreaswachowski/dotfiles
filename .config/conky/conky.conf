local _dirname_ = debug.getinfo(1, "S").source:sub(2):match("(.*[/\\])")

conky.config = {

	--Various settings
		background = true,
		xinerama_head = 0,
		cpu_avg_samples = 2,
		diskio_avg_samples = 10,
		double_buffer = true,
		if_up_strictness = 'address',
		net_avg_samples = 2,
		no_buffers = true,
		temperature_unit = 'celsius',
		update_interval = 1.0,
		imlib_cache_size = 0,
		out_to_console = false,
		out_to_stderr = false,
		extra_newline = false,
		own_window = true,
		stippled_borders = 0,
		uppercase = false,
		use_spacer = 'none',

	-- Placement
	-- Pixel values are in logical pixels: conky scales them by Xft.dpi (163 = 1.7 x 96 on the
	-- 4K screen), so the usable height is roughly 2160 / 1.7 = 1270 px.

		alignment = 'top_left',
		gap_x = 20,
		gap_y = 30,
		minimum_width = 350,
		maximum_width = 350,
	--Graphical

		border_inner_margin = 10,
		border_outer_margin = 10,
		draw_borders = false,
		draw_graph_borders = true,
		draw_shades = false,
		draw_outline = false,
		show_graph_scale = false,
    	show_graph_range = false,
    	own_window_argb_visual = true,
    	own_window_transparent = false,
    	own_window_argb_value = 170,
		own_window_colour = '1a1b26',
    	-- 'override' bypasses KWin entirely and therefore always stays on top; 'normal' + the 'below'
	-- hint lets KWin keep it beneath other windows. Options: normal/override/dock/desktop/panel
    	own_window_type = 'normal',
        own_window_class = 'Conky',
        own_window_hints = 'undecorated,below,skip_taskbar,sticky,skip_pager' ,

	-- Text

		-- text
		font = 'JetBrains Mono:size=10',
		format_human_readable = true,
		use_xft = true,
	    max_text_width = 0,
		short_units = true,
		xftalpha = 1,
		override_utf8_locale = true,

    -- Colors

    	default_color = 'a2a8ba',
    	default_outline_color = 'white',
    	default_shade_color = 'white',
    	-- md blue (200)
    	color1 = '81a1c1',										-- title color

    	-- md blue (200)
    	color3 = '81a1c1',										-- text color

    	-- md dark blue (200 -> dark)
    	color4 = '81a1c1'			,							-- accent color
		color5 = 'f06a2b',										-- graph color

}

conky.text = [[
${font :size=36}${color1}${alignc}${time %H:%M}
${font}${color}${voffset -20}${alignc}${time %A %d %B %Y}
${color3}${hr 2}
${color3}Uptime: ${alignr}${color}$uptime_short
${color3}Boot Time: ${color}${alignr}${execi 3600 systemd-analyze | grep -oP '= \K.*'}
${color3}Kernel: ${alignr}${color}${kernel}

${color3}${execi 3600 /home/andreas/.config/conky/week_complete.sh}
${color3}${execibar 3600 10 /home/andreas/.config/conky/week_percentage.sh}

${font}${color1}AUDIO ${hr 2}
${color3}Output:  ${alignr}${color}${pa_sink_active_port_description}
${pa_sink_volumebar}

#------------+
#TEMPS
#------------+
${font}${color1}TEMPS ${hr 2}
# k10temp temp1 is Tctl, the AMD CPU control temperature
${voffset 5}${color3}CPU: ${alignr}$color${hwmon k10temp temp 1}°C
${color3}GPU: ${alignr}$color${execi 5 nvidia-smi --id=0 --query-gpu=temperature.gpu --format=csv,noheader}°C

#------------+
#CPU
#------------+
${font}${color1}PROCESSOR ${hr 2}
${color3}Freq: ${alignr}$color${freq_g} GHz
${color3}Usage: ${alignr}$color${cpu}%
${color4}${cpugraph cpu }

#------------+
#GPU
#------------+
# The nvidia variables need the NV-CONTROL X extension, which Xwayland lacks, so query
# nvidia-smi instead.
${font}${color1}GPU ${hr 2}
${color3}Name:  ${alignr}${color}${execi 3600 nvidia-smi --id=0 --query-gpu=name --format=csv,noheader | sed 's/NVIDIA //; s/ Workstation Edition//'}
${color3}Util:  ${alignr}${color}${execi 2 nvidia-smi --id=0 --query-gpu=utilization.gpu --format=csv,noheader}
${color4}${execibar 2 nvidia-smi --id=0 --query-gpu=utilization.gpu --format=csv,noheader,nounits}
${color3}VRAM:  ${alignr}${color}${execi 5 nvidia-smi --id=0 --query-gpu=memory.used,memory.total --format=csv,noheader | sed 's| MiB, | / |'}
${color4}${execibar 5 /home/andreas/.config/conky/nvidia_mem_percent.sh}
${color3}Power: ${alignr}${color}${execi 5 nvidia-smi --id=0 --query-gpu=power.draw --format=csv,noheader}
${color3}Driver:  ${alignr}${color}${execi 3600 nvidia-smi --id=0 --query-gpu=driver_version --format=csv,noheader}

#------------+
#PROCESSES
#------------+
${font}${color1}PROCESS ${hr 2}
${voffset 5}${color3}Name${alignr}CPU%
$color4${top name 1}$alignr${top cpu 1}$color
${top name 2} ${alignr}${top cpu 2}
${top name 3} ${alignr}${top cpu 3}

${color3}Processes: ${alignr}${color}${processes} (${running_processes})
${color3}Threads: ${alignr}${color}${threads} (${running_threads})

#------------+
#MEMORY
#------------+
${font}${color1}MEMORY ${hr 2}
${voffset 5}${font}${color3}Used: ${color}${mem} ($memperc%)${color3}${alignr}Free: ${color}${memeasyfree}
${color4}${membar}

#------------+
#NETWORK
#------------+
# enp211s0f0np0 is the interface carrying the default route
${font}${color1}NETWORK ${hr 2}
${if_up enp211s0f0np0}\
${voffset 5}${color3}Address: ${alignr}${color}${addr enp211s0f0np0}
${color3}Established: ${alignr}${color}${execi 5 ss -Htn state established | grep -vcF -e 127.0.0.1 -e '[::1]'}
${color3}Down: ${color}${downspeed enp211s0f0np0}/s${color3}${alignr}Total: ${color}${totaldown enp211s0f0np0}
${color4}${downspeedgraph enp211s0f0np0}
${color3}Up: ${color}${upspeed enp211s0f0np0}/s${color3}${alignr}Total: ${color}${totalup enp211s0f0np0}
${color4}${upspeedgraph enp211s0f0np0}
${else}\
${color5}enp211s0f0np0 is down
${endif}
]]
